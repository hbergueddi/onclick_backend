# ════════════════════════════════════════════════════════════════════
# application-vault.yml — Sprint I.8 (profile `vault` actif)
# ════════════════════════════════════════════════════════════════════
#
# Active Spring Cloud Vault Config pour charger les secrets depuis
# /v1/secret/data/oneclick AVANT que Spring résolve les @Value.
#
# Activation :
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=enterprise,vault
#   ou : SPRING_PROFILES_ACTIVE=enterprise,vault java -jar oneclick.jar
#
# Vault expose les secrets flat sous `secret/oneclick` avec préfixes
# hiérarchiques (cf scripts/vault-bootstrap.sh) :
#   db.username, db.password, db.url
#   jwt.secret, jwt.issuer, jwt.ttl-seconds, jwt.refresh-ttl-days
#   ai.groq.api-key, ai.groq.endpoint, ai.groq.model
#   notification.fcm.project-id, notification.fcm.service-account-json
#   ocr.space.api-key, ocr.space.endpoint
#   email.resend.api-key, email.from.default
#   google.places.api-key
#   monitoring.sentry.dsn, monitoring.sentry.environment, monitoring.sentry.traces-sample-rate
#   wallet.apple.*, wallet.google.*
#   rate-limit.enabled, rate-limit.*-tokens-per-minute
#
# NOTE IMPORTANTE : on utilise `monitoring.sentry.*` (préfixé) au lieu de
# `sentry.*` pour éviter le conflit avec l'auto-config Sentry qui résout
# elle-même sentry.dsn → boucle circulaire de placeholder.

spring:
  cloud:
    vault:
      enabled: true
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:oneclick-dev-root}
      kv:
        enabled: true
        backend: secret
        default-context: oneclick
        application-name: oneclick
      # Echec safe en dev : si Vault est down, on continue avec les valeurs
      # par défaut. EN PROD : passer à `true` pour bloquer le boot.
      fail-fast: ${VAULT_FAIL_FAST:false}
      authentication: ${VAULT_AUTH:TOKEN}

  # ─── Mapping secrets Vault → Spring properties ──────────────────────
  # Spring Cloud Vault ajoute le PropertySource `secret/oneclick` en début
  # de chaîne. Les keys (db.username, jwt.secret, ai.groq.api-key, etc.)
  # sont accessibles via ${db.username}, ${jwt.secret}, etc.
  datasource:
    username: ${db.username:${DEV_DB_USERNAME:hh}}
    password: ${db.password:${DEV_DB_PASSWORD:oneclick_dev_pwd}}
    url: ${db.url:${DEV_DB_URL:jdbc:postgresql://localhost:5432/oneclick_local}}

app:
  security:
    jwt-secret: ${jwt.secret:${APP_SECURITY_JWT_SECRET:dev-secret-not-for-production}}
    jwt-issuer: ${jwt.issuer:oneclick-enterprise}
  ai:
    groq:
      api-key: ${ai.groq.api-key:${GROQ_API_KEY:}}
      endpoint: ${ai.groq.endpoint:https://api.groq.com/openai/v1/chat/completions}
      model: ${ai.groq.model:llama-3.3-70b-versatile}
  notification:
    fcm:
      project-id: ${notification.fcm.project-id:${FCM_PROJECT_ID:}}
      service-account-json: ${notification.fcm.service-account-json:${FCM_SERVICE_ACCOUNT_JSON:}}
  ocr:
    space:
      api-key: ${ocr.space.api-key:${OCR_SPACE_API_KEY:}}
      endpoint: ${ocr.space.endpoint:https://api.ocr.space/parse/imageurl}
  email:
    resend:
      api-key: ${email.resend.api-key:${RESEND_API_KEY:}}
    from:
      default: ${email.from.default:OneClick <noreply@app-oneclick.net>}
  google:
    places:
      api-key: ${google.places.api-key:${GOOGLE_PLACES_API_KEY:}}
  wallet:
    apple:
      pass-type-id: ${wallet.apple.pass-type-id:pass.ma.oneclick.loyalty}
      team-id: ${wallet.apple.team-id:PX5PTJXLPX}
      cert-base64: ${wallet.apple.cert-base64:}
    google:
      issuer-id: ${wallet.google.issuer-id:0000000000000000000}
      service-account-json: ${wallet.google.service-account-json:}
  rate-limit:
    enabled: ${rate-limit.enabled:false}
    global-tokens-per-minute: ${rate-limit.global-tokens-per-minute:100}
    login-tokens-per-minute: ${rate-limit.login-tokens-per-minute:10}

# Sentry : NE PAS overrider `sentry.dsn` ici (conflit avec auto-config Sentry).
# La valeur de monitoring.sentry.* vient de Vault. Pour brancher Sentry sur
# cette valeur, on peut soit :
#   1. Mettre la vraie clé directement dans la config Vault sous le nom
#      `sentry.dsn` (mais alors le conflit re-arrive)
#   2. Utiliser un @ConfigurationProperties dédié qui prend `monitoring.sentry.*`
#      et appelle Sentry.init(...) manuellement au démarrage.
# Le pattern senior est l'option 2 — implémenté dans Sentry config quand
# besoin réel d'override (cf application-prod.yml).
