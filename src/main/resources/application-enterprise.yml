# ════════════════════════════════════════════════════════════════════
# OneClick Backend — ENTERPRISE profile (refonte greenfield, branche enterprise-architecture)
# ════════════════════════════════════════════════════════════════════
# Database : oneclick_enterprise (PostgreSQL 17 local, schéma greenfield Flyway V1+)
# DB legacy : oneclick_local reste intacte pour ETL data migration (phase finale)
# Redis    : local (no auth)
# Server   : http://localhost:8083 (8081 = legacy Spring, 8082 = Phase 11/12 archive)
# Swagger  : http://localhost:8083/swagger-ui.html
# ════════════════════════════════════════════════════════════════════

spring:
  config:
    activate:
      on-profile: enterprise

  datasource:
    # SECURITY : passwords externalisés via env vars. Defaults uniquement pour
    # setup local (compose.yaml). En prod : ENTERPRISE_DB_PASSWORD via secret manager.
    url: ${ENTERPRISE_DB_URL:jdbc:postgresql://localhost:5432/oneclick_enterprise}
    username: ${ENTERPRISE_DB_USERNAME:oneclick_app}
    password: ${ENTERPRISE_DB_PASSWORD:OneclickLocal2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Lazy fetching debug — log si on déclenche un fetch hors @Transactional
        # session.lazy_load_no_trans: false
        # Évite N+1 silencieux
    # ddl-auto=validate hérité de application.yml — Flyway gère le schéma

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    # Greenfield : pas de baseline, Flyway exécute toutes les V1+ depuis db/migration/
    baseline-on-migrate: false
    # SECURITY : Flyway tourne sous "hh" (owner des tables locales). En prod, le
    # pipeline crée la DB owned par oneclick_app — ENTERPRISE_FLYWAY_PASSWORD vide.
    user: ${ENTERPRISE_FLYWAY_USER:hh}
    password: ${ENTERPRISE_FLYWAY_PASSWORD:oneclick_dev_pwd}
    locations: classpath:db/migration

server:
  port: 8083

# ─── Google Places API — clé dev locale ────────────────────────────────
# Surcharge possible via env var GOOGLE_PLACES_API_KEY (recommandé en CI/prod).
# Clé locale ci-dessous : projet places-491117, contact@onesley.com (cf CLAUDE.md).
# Utilisée par GooglePlacesEnrichmentService pour POST /api/restaurants/{id}/enrich-google-places.
app:
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:AIzaSyDazJrl-4y4vceQw9XhRuKQgMe4eDtBiM8}

logging:
  level:
    com.onesley.oneclick: DEBUG
    org.springframework.modulith: INFO
    # Trace les SQL Hibernate (volume important)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE

# ─── Actuator — dev local : détail complet du /actuator/health ────────
# show-details=always (override le defaut when-authorized de application.yml)
# Permet d'identifier quel HealthIndicator est DOWN sans avoir à s'auth.
management:
  endpoint:
    health:
      show-details: always
      show-components: always
  # Health probe Elasticsearch — réactivé après upgrade serveur 7.17 → 9.4
  # (Sprint ES, mai 2026). Le client embarqué Spring Boot 4.0.6 est
  # elasticsearch-java 9.2.8 — désormais compatible avec le serveur.
  # health:
  #   elasticsearch:
  #     enabled: true   # default = true, donc commenté

# ─── Spring Modulith (in-process events, PAS Kafka — monolithe §21) ──
spring.modulith:
  events:
    # Schema géré par Flyway V8 (pas par Modulith auto-init pour cohérence DB)
    jdbc-schema-initialization:
      enabled: false
    # PAS d'externalisation Kafka : les events restent in-process
    # (publication ApplicationEventPublisher + @TransactionalEventListener)
    externalization:
      enabled: false
  # Re-publication des events en attente au boot (recovery après crash)
  republish-outstanding-events-on-restart: true
