# ════════════════════════════════════════════════════════════════════
# OneClick Backend — ENTERPRISE profile (refonte greenfield, branche enterprise-architecture)
# ════════════════════════════════════════════════════════════════════
# Database : oneclick_enterprise (PostgreSQL 17 local, schéma greenfield Flyway V1+)
# DB legacy : oneclick_local reste intacte pour ETL data migration (phase finale)
# Redis    : local (no auth)
# Server   : http://localhost:8083 (8081 = legacy Spring, 8082 = Phase 11/12 archive)
# Swagger  : http://localhost:8083/swagger-ui.html
# ════════════════════════════════════════════════════════════════════

spring:
  config:
    activate:
      on-profile: enterprise

  datasource:
    url: jdbc:postgresql://localhost:5432/oneclick_enterprise
    username: oneclick_app
    password: OneclickLocal2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Lazy fetching debug — log si on déclenche un fetch hors @Transactional
        # session.lazy_load_no_trans: false
        # Évite N+1 silencieux
    # ddl-auto=validate hérité de application.yml — Flyway gère le schéma

  data:
    redis:
      host: localhost
      port: 6379

  # ─── Kafka (Phase 2 §21 spec senior) ──────────────────────────────────
  # Spring Modulith pré-sérialise les events en JSON bytes via Jackson avant
  # de les envoyer à KafkaTemplate. On utilise donc ByteArraySerializer pour
  # éviter le double-wrapping (sinon JsonSerializer base64-encoderait les bytes).
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        # Idempotent producer (pas de doublons à la retransmission)
        enable.idempotence: true
        acks: all
    consumer:
      group-id: oneclick-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record

  flyway:
    # Greenfield : pas de baseline, Flyway exécute toutes les V1+ depuis db/migration/
    baseline-on-migrate: false
    user: hh
    password: oneclick_dev_pwd
    locations: classpath:db/migration

server:
  port: 8083

logging:
  level:
    com.onesley.oneclick: DEBUG
    org.springframework.modulith: INFO
    # Trace les SQL Hibernate (volume important)
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE

# ─── Spring Modulith — détection des modules + verify isolation ──────
spring.modulith:
  events:
    # Schema géré par Flyway V8 (pas par Modulith auto-init pour cohérence DB)
    jdbc-schema-initialization:
      enabled: false
    # Externalisation : routing key = topic name dans @Externalized
    externalization:
      enabled: true
  # Re-publication des events en attente au boot (recovery après crash)
  republish-outstanding-events-on-restart: true
