# ════════════════════════════════════════════════════════════════════
# OneClick Backend — PROD profile (template — to complete by ops)
# ════════════════════════════════════════════════════════════════════
# All sensitive values come from environment variables — never hardcoded.
# Required env vars at deployment:
#   DB_URL              jdbc:postgresql://host:5432/oneclick
#   DB_USERNAME         (default: oneclick_app)
#   DB_PASSWORD         REQUIRED
#   REDIS_HOST          (default: localhost)
#   REDIS_PORT          (default: 6379)
#   REDIS_PASSWORD      (optional, prod usually has one)
#   SENTRY_DSN          (optional, observability)
# ════════════════════════════════════════════════════════════════════

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oneclick}
    username: ${DB_USERNAME:oneclick_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      # Validate connections before use (recommended in prod)
      connection-test-query: SELECT 1

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Avoid statistics overhead in prod (enable selectively for tuning)
        generate_statistics: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  # ─── Elasticsearch prod (Sprint G.6.3 — TLS + API key) ─────────────────
  # En dev compose : xpack.security.enabled=false. En prod : ENABLED + TLS.
  # Procédure setup ES prod :
  #   1. ES container : xpack.security.enabled=true, xpack.security.http.ssl.enabled=true
  #   2. Bootstrap : `docker exec -it es bin/elasticsearch-setup-passwords auto`
  #   3. Create API key : `POST /_security/api_key {"name":"oneclick-backend","role_descriptors":{}}`
  #   4. Copier API key encodée + CA fingerprint dans .env prod
  #   5. ES_URL=https://elasticsearch.prod:9200 ES_API_KEY=<key> ES_CA_FINGERPRINT=<sha256>
  elasticsearch:
    uris: ${ES_URL:https://elasticsearch:9200}
    # API key (recommandé) — Authorization: ApiKey <encoded>
    # Spring Data ES utilise une RestClient sous le capot.
    # Pour API key : configurer via Bean RestClientBuilderCustomizer (cf src/main/java/com/onesley/oneclick/modules/analytics/search/EsClientConfig.java)
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:}

  flyway:
    # In prod, validate strictly — no baseline-on-migrate (would mask schema drift)
    baseline-on-migrate: false

server:
  # Behind Nginx reverse proxy (port 80/443 -> backend 8080)
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # Restrict in prod : only health + info + metrics (no env, no flyway)
        include: health, info, metrics
  endpoint:
    health:
      show-details: never  # never leak DB URL etc. to anonymous probes

logging:
  level:
    com.onesley.oneclick: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: /var/log/oneclick/backend.log
    max-size: 100MB
    max-history: 30

# ─── Security (prod) ──────────────────────────────────────────────────
# OAuth2 Resource Server activé. JWT Supabase HS256 avec secret partagé
# (cf scripts/setup-supabase-jwt.md).
# REQUIRED env vars:
#   APP_SECURITY_OAUTH2_ENABLED=true     (default in prod)
#   APP_SECURITY_JWT_SECRET=<supabase>   (REQUIRED — boot fails if missing)
app:
  security:
    oauth2:
      enabled: ${APP_SECURITY_OAUTH2_ENABLED:true}
    jwt-secret: ${APP_SECURITY_JWT_SECRET}

  # ─── FCM : envoi réel activé en prod (override du défaut safe-by-default=false) ──
  # Surchargeable par FCM_DISPATCH_ENABLED si besoin de couper l'envoi en incident.
  fcm:
    dispatch-enabled: ${FCM_DISPATCH_ENABLED:true}

  # ─── Rate limiting prod (Sprint G.6.1 — anti-bruteforce activé) ────────
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # defaults + endpoints héritent de application.yml — override uniquement
    # ici si besoin (par ex en cas de DDoS, baisser temporairement les capacities).

  # ─── Chatbot IA (module core/ai) — prod ──────────────────────────────
  # Provider du chat : ollama (local) | groq (managé). Pour du 100 % Groq sur
  # le VPS (pas de serveur Ollama installé) : AI_PROVIDER=groq + GROQ_API_KEY.
  # NB : Groq ne fournit PAS d'embeddings → le RAG reste servi par Ollama ;
  # sans Ollama joignable, le RAG est ignoré (warn) et le chat répond quand même.
  ai:
    provider: ${AI_PROVIDER:ollama}
    groq:
      api-key: ${GROQ_API_KEY:}                                          # REQUIS si AI_PROVIDER=groq — jamais en dur
      endpoint: ${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      timeout: ${GROQ_TIMEOUT:PT60S}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: ${OLLAMA_TIMEOUT:PT60S}
