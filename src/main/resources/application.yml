# ════════════════════════════════════════════════════════════════════
# OneClick Backend — Common configuration (all profiles)
# ════════════════════════════════════════════════════════════════════
# Profile-specific overrides:
#   - application-dev.yml   (local development)
#   - application-prod.yml  (production)
# Active profile selection:
#   - default         -> dev
#   - via env var     -> SPRING_PROFILES_ACTIVE=prod
#   - via -D arg      -> -Dspring.profiles.active=prod
# ════════════════════════════════════════════════════════════════════

spring:
  application:
    name: oneclick-backend
  profiles:
    default: dev

  jpa:
    # NEVER use ddl-auto=update/create in prod. Schema is managed by Flyway.
    hibernate:
      ddl-auto: validate
    # Avoid lazy-loading triggered by views/REST controllers (anti-pattern)
    open-in-view: false
    properties:
      hibernate:
        # Always store timestamps in UTC, format dates in app code
        jdbc:
          time_zone: UTC
        # Disable in prod, enable in dev profile
        format_sql: false
        # Hibernate 7 uses logical names natively. No naming-strategy override.

  flyway:
    enabled: true
    locations: classpath:db/migration
    # On non-empty DBs (restored from Supabase), Flyway baselines at V1 — V1 itself
    # is NOT re-applied. On fresh DBs (CI/tests), V1 IS applied normally.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 'OneClick schema baseline (extracted from Supabase prod dump)'
    # Validate migrations checksums on startup
    validate-on-migrate: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
      # We use Redis only for cache (Spring Cache), not as a key-value store
      # via Spring Data repositories. Disabling repository auto-discovery
      # prevents Spring from trying to claim our JPA interfaces as Redis ones.
      repositories:
        enabled: false

  # ─── Multipart upload limits (Phase 3.5 — MinIO uploads) ────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# ─── Storage S3/MinIO (Phase 3.5 §X spec senior) ───────────────────────
# Local dev : MinIO sur localhost:9000 (cf scripts/minio-start.sh)
# Prod      : override endpoint + access-key + secret-key via env vars (S3 AWS)
app:
  # ─── Frontend base URLs (liens email : invitation tenant-admin, décision onboarding) ──
  # Prod : override via les variables d'env correspondantes.
  #  - base-url     : portail public/client (app-oneclick.net)
  #  - admin-base-url    : Command Center super-admin (admin.app-oneclick.net) — lien « Examiner la demande »
  #  - business-base-url : portail restaurateur OneClick Business (business.app-oneclick.net) — lien « Accéder à mon espace »
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://app-oneclick.net}
    admin-base-url: ${APP_FRONTEND_ADMIN_BASE_URL:https://admin.app-oneclick.net}
    business-base-url: ${APP_FRONTEND_BUSINESS_BASE_URL:https://business.app-oneclick.net}

  # ─── CORS (origines autorisées à appeler l'API cross-origin) ───────────────
  # Les SPA prod (app/admin/business) servies sur leurs sous-domaines appellent
  # api.app-oneclick.net → doivent être whitelistées ici. Override prod via APP_CORS_ALLOWED_ORIGINS.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173,https://app-oneclick.net,https://admin.app-oneclick.net,https://business.app-oneclick.net}

  # ─── Auth / enrollment (P1) ────────────────────────────────────────────
  # email-verification-required=true → le signup public crée le compte en
  # pending_email_verification : l'utilisateur doit valider l'OTP reçu par email
  # (POST /api/auth/otp/request signup → /otp/verify) avant de pouvoir se connecter.
  # Défaut false (rétro-compat clients déployés sans écran OTP). Activer en prod via
  # APP_AUTH_EMAIL_VERIFICATION_REQUIRED=true quand tous les clients embarquent l'OTP.
  auth:
    email-verification-required: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:false}
    # Purge automatique des comptes restés pending_email_verification au-delà de ce délai
    # (signup abandonné OU bot) : libère l'email pour une ré-inscription + évite le bloat DB.
    # Cron horaire (PendingSignupPurgeJob). Inerte tant que email-verification-required=false.
    pending-verification-ttl-hours: ${APP_AUTH_PENDING_VERIFICATION_TTL_HOURS:24}

  # ─── Rate limiting (Sprint G.6.1 — Bucket4j in-memory) ─────────────────
  # Active = false par défaut (DX dev). En prod : enabled=true via env var
  # APP_RATE_LIMIT_ENABLED=true. Override par endpoint via la liste endpoints.
  # Bucket4j en mémoire (ConcurrentHashMap) — single instance OK, V2 Redis distribué.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:false}
    defaults:
      capacity: 60                # 60 req / minute par IP (large default)
      refill-period: PT1M
    endpoints:
      # Anti-bruteforce login : 10 tentatives / min par IP
      - path: /api/auth/login
        capacity: 10
        refill-period: PT1M
      # Signup / vérification email — ENVOI du code OTP : anti-spam d'emails (Resend) — 5 / 15 min par IP
      - path: /api/auth/otp/request
        capacity: 5
        refill-period: PT15M
      # SAISIE du code OTP : marge pour les essais (typo) sans bloquer un user légitime — 10 / 15 min par IP
      - path: /api/auth/otp/verify
        capacity: 10
        refill-period: PT15M
      # Fallback autres /otp/* (le matcher prend le 1er match → les specifics ci-dessus l'emportent) — 5 / 15 min
      - path: /api/auth/otp/**
        capacity: 5
        refill-period: PT15M
      # Refresh token : 30 / min (cas légitimes nombreux avec rotation)
      - path: /api/auth/refresh
        capacity: 30
        refill-period: PT1M
      # Acceptation invitation tenant-admin (E2) : anti-abus du lien magique — 10 / 15 min par IP
      - path: /api/auth/accept-tenant-admin-invite
        capacity: 10
        refill-period: PT15M
      # Mot de passe oublié (Phase A) : anti-abus de l'envoi de code — 5 / 15 min par IP
      - path: /api/auth/forgot-password
        capacity: 5
        refill-period: PT15M
      # Réinitialisation mot de passe (Phase A) : anti-bruteforce du code OTP — 10 / 15 min par IP
      - path: /api/auth/reset-password
        capacity: 10
        refill-period: PT15M
      # Catalogue public restos : 120 / min (browse rapide Login.tsx picker)
      - path: /api/restaurants
        capacity: 120
        refill-period: PT1M
      # Search full-text : 30 / min (anti-scraping)
      - path: /api/search/restaurants/**
        capacity: 30
        refill-period: PT1M
      # BE-4 — autocomplétion Google Places (coût $/appel + clé serveur) : 20 / min par IP
      - path: /api/places/search
        capacity: 20
        refill-period: PT1M
      # OCR (coûteux) : 20 / heure par IP
      - path: /api/loyalty/ocr-receipt
        capacity: 20
        refill-period: PT1H
      # AI Groq (cap tokens) : différenciation par usage
      - path: /api/ai/care-chat
        capacity: 30
        refill-period: PT1H
      - path: /api/ai/assistant
        capacity: 15
        refill-period: PT1H
      - path: /api/ai/elite-review
        capacity: 10
        refill-period: PT1H
      - path: /api/ai/plan
        capacity: 5
        refill-period: PT1H

  # ─── OCR (Phase B.8 — port snap2earn/ocr-receipt Edge Functions) ─────
  # Si api-key non défini, le service tombe en mode stub (réponse vide + log warn).
  ocr:
    space:
      api-key: ${OCR_SPACE_API_KEY:}
      endpoint: ${OCR_SPACE_ENDPOINT:https://api.ocr.space/parse/imageurl}
      language: ${OCR_SPACE_LANGUAGE:fre}

  # ─── FCM Push notifications (Phase B.8 — port send-*-push Edge Functions) ─
  # Si service-account-json non défini, le service tombe en mode stub
  # (log + retour { sent: 0, total: 0, message: "FCM not configured" }).
  fcm:
    project-id: ${FCM_PROJECT_ID:}
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    # Garde-fou d'envoi réel. Défaut FALSE = safe-by-default : même AVEC des clés
    # valides (ex: run-config dev IntelliJ), AUCUN push FCM réel n'est émis tant que
    # ce flag n'est pas explicitement activé. Évite que des dispatches dormants
    # (events Modulith republiés au restart) ou des tests partent vers de vrais
    # appareils. Prod l'active (application-prod.yml) ; en dev, exporter
    # FCM_DISPATCH_ENABLED=true le temps d'un test d'envoi réel.
    dispatch-enabled: ${FCM_DISPATCH_ENABLED:false}

  # ─── AI Groq (Sprint B.1 G.4-bis — port 4 EFs : care-chat, ai-assistant, elite-review, generate-plan) ──
  # Si api-key non défini : GroqClient bascule en stub mode (réponse factice + log warn).
  ai:
    # Provider du chatbot (module core/ai) : ollama (local, défaut) | groq (managé, rapide).
    # Les embeddings restent servis par Ollama quel que soit le provider de chat.
    provider: ${AI_PROVIDER:ollama}
    groq:
      api-key: ${GROQ_API_KEY:}                        # externalisée (.env / env prod) — jamais en dur
      endpoint: ${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}  # client Groq legacy
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}                    # ChatModel LangChain4j
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      timeout: ${GROQ_TIMEOUT:PT60S}
    # ─── Ollama (LangChain4j — module core/ai, LLM local self-hosted) ──────────
    # Connexion à un serveur Ollama local/distant. chat-model = génération,
    # embedding-model = vecteurs (préparé pour RAG + pgvector, pas encore câblé).
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # Défaut local stable pour le VM Docker (~7,65 GB partagé) : llama3.2:3b (~2,9 GB, CPU-only).
      # Modèles 8B (qwen3:8b, ...) : OOM tant que le VM Docker n'est pas ≥ 12 GB. Surchargeable en prod.
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: ${OLLAMA_TIMEOUT:PT60S}
      log-requests: ${OLLAMA_LOG_REQUESTS:false}
      log-responses: ${OLLAMA_LOG_RESPONSES:false}

  # ─── Email Resend (Sprint I.3 — emails brandés : onboarding, feedback, verdicts) ──
  # Si api-key non défini : ResendClient bascule en stub mode (log warn, AUCUN envoi).
  # Prod : RESEND_API_KEY dans l'EnvironmentFile systemd (cf deploy/DEPLOYMENT-ENV.md).
  email:
    resend:
      api-key: ${RESEND_API_KEY:}
    # Boîte interne qui reçoit le récap de CHAQUE demande d'inscription resto.
    # contact@app-oneclick.net (OVH) — PAS contact@onesley.com (M365 → quarantaine).
    internal:
      onboarding: ${APP_EMAIL_INTERNAL_ONBOARDING:contact@app-oneclick.net}

  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      path-style: ${S3_PATH_STYLE:true}
      bucket: ${S3_BUCKET:oneclick-media}
      public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
    media:
      max-size-mb: 10

server:
  port: 8081  # 8080 is taken by the React Vite dev server
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never  # never expose stack traces to clients

# ─── OpenAPI / Swagger UI ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
  packages-to-scan: com.onesley.oneclick

# ─── Spring Boot Actuator (health/info/metrics) ───────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, flyway, env
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    # build-info.properties (généré par spring-boot-maven-plugin) → clé "build"
    build:
      enabled: true
    # git.properties (généré par git-commit-id-maven-plugin) → clé "git"
    # mode: simple (commit + branch + time) | full (tout)
    git:
      enabled: true
      mode: full
    # info.* dans application.yml → clé "app" (ci-dessous) + "java", "os"
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# ─── Custom info exposé sur /actuator/info sous "app" ─────────────────
info:
  app:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'
    java-version: '@java.version@'
    spring-boot-version: '@project.parent.version@'
    encoding: '@project.build.sourceEncoding@'
  contact:
    team: 'Onesley'
    email: 'contact@onesley.com'
  links:
    swagger-ui: 'http://localhost:8081/swagger-ui/index.html'
    api-docs: 'http://localhost:8081/v3/api-docs'
    health: 'http://localhost:8081/actuator/health'

# ─── Logging defaults (overridden per profile) ────────────────────────
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
  level:
    root: INFO
    com.onesley.oneclick: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
