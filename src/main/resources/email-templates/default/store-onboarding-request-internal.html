<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f1ee;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#2b2430">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px">
    <div style="text-align:center;margin:0 0 20px">
      <img src="https://api.app-oneclick.net/email/oneclick-logo.png?v=2" alt="OneClick" width="140" style="display:inline-block;width:140px;height:auto;border:0;outline:none;text-decoration:none" />
    </div>
    <div style="background:#ffffff;border-radius:16px;padding:32px;border:1px solid #ece6e1">
      <h1 style="margin:0 0 8px;font-size:20px;color:#714B67">Nouvelle demande de partenariat</h1>
      <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#5b5560">
        Une enseigne souhaite rejoindre OneClick. À étudier dans l'espace admin.
      </p>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-collapse:collapse">
        <tr><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;width:140px;color:#8a838f">Enseigne</td><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;font-weight:600;color:#2b2430">{{businessName}}</td></tr>
        <tr><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;color:#8a838f">Ville</td><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;color:#2b2430">{{city}}</td></tr>
        <tr><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;color:#8a838f">Gérant</td><td style="padding:10px 0;border-bottom:1px solid #f0ebe7;color:#2b2430">{{contactName}}</td></tr>
        <tr><td style="padding:10px 0;color:#8a838f">Email</td><td style="padding:10px 0;color:#2b2430">{{ownerEmail}}</td></tr>
      </table>
      <p style="margin:28px 0 0;text-align:center">
        <a href="{{adminLink}}"
           style="display:inline-block;background:#714B67;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:14px 28px;border-radius:10px">
          Examiner la demande
        </a>
      </p>
    </div>
    <p style="margin:16px 0 0;text-align:center;font-size:11px;color:#a59ea8">
      OneClick — notification interne
    </p>
  </div>
</body>
</html>
