  <g filter="url(#shCard)">
    <rect x="20" y="484" width="353" height="226" rx="16" fill="#1E1119"/>
  </g>

  <!-- Ligne 1 -->
  <rect x="40" y="504" width="22" height="22" rx="6" fill="#1E1119" stroke="#3A2A34" stroke-width="1.5"/>
  <text x="72" y="513" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">bg</text>
  <text x="72" y="527" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#1E1119</text>

  <rect x="210" y="504" width="22" height="22" rx="6" fill="#2A1B25"/>
  <text x="242" y="513" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">surface</text>
  <text x="242" y="527" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#2A1B25</text>

  <!-- Ligne 2 -->
  <rect x="40" y="544" width="22" height="22" rx="6" fill="#241620"/>
  <text x="72" y="553" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">surfaceMuted</text>
  <text x="72" y="567" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#241620</text>

  <rect x="210" y="544" width="22" height="22" rx="6" fill="#3A2A34"/>
  <text x="242" y="553" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">hairline</text>
  <text x="242" y="567" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#3A2A34</text>

  <!-- Ligne 3 -->
  <rect x="40" y="584" width="22" height="22" rx="6" fill="#F4ECEF"/>
  <text x="72" y="593" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">text.primary</text>
  <text x="72" y="607" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#F4ECEF</text>

  <rect x="210" y="584" width="22" height="22" rx="6" fill="#B9A9B3"/>
  <text x="242" y="593" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">text.secondary</text>
  <text x="242" y="607" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#B9A9B3</text>

  <!-- Ligne 4 -->
  <rect x="40" y="624" width="22" height="22" rx="6" fill="#8E2A50"/>
  <text x="72" y="633" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">primary (éclairci)</text>
  <text x="72" y="647" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#8E2A50</text>

  <rect x="210" y="624" width="22" height="22" rx="6" fill="#E0AF7C"/>
  <text x="242" y="633" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#F4ECEF">gold</text>
  <text x="242" y="647" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#B9A9B3">#E0AF7C</text>

  <!-- Aperçu carte dark mode -->
  <rect x="40" y="668" width="313" height="26" rx="8" fill="#2A1B25"/>
  <circle cx="56" cy="681" r="6" fill="#E0AF7C"/>
  <text x="70" y="685" font-family="'Poltawski Nowy',Georgia,serif" font-size="12" font-weight="600" fill="#F4ECEF">Aperçu surface sombre</text>
  <rect x="290" y="674" width="48" height="14" rx="7" fill="#8E2A50"/>
  <text x="314" y="684" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="9" font-weight="700" fill="#F4ECEF">CTA</text>

  <!-- ============ SECTION C : RAPPEL MARQUE ============ -->
  <text x="20" y="730" font-family="'Poltawski Nowy',Georgia,serif" font-size="16" font-weight="600" fill="#3B2338">C — Rappel marque</text>

  <!-- Bordeaux -->
  <g filter="url(#shCard)"><rect x="20" y="740" width="113" height="86" rx="12" fill="#FFFFFF"/></g>
  <rect x="33" y="752" width="87" height="40" rx="8" fill="#681237"/>
  <text x="33" y="810" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#242424">Bordeaux</text>
  <text x="33" y="823" font-family="'Nunito Sans',sans-serif" font-size="10" fill="#999999">#681237</text>

  <!-- Champagne -->
  <g filter="url(#shCard)"><rect x="140" y="740" width="113" height="86" rx="12" fill="#FFFFFF"/></g>
  <rect x="153" y="752" width="87" height="40" rx="8" fill="#E0AF7C"/>
  <text x="153" y="810" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#242424">Champagne</text>
  <text x="153" y="823" font-family="'Nunito Sans',sans-serif" font-size="10" fill="#999999">#E0AF7C</text>

  <!-- Crème -->
  <g filter="url(#shCard)"><rect x="260" y="740" width="113" height="86" rx="12" fill="#FFFFFF"/></g>
  <rect x="273" y="752" width="87" height="40" rx="8" fill="#F9F6F4" stroke="#E8DFE5" stroke-width="1"/>
  <text x="273" y="810" font-family="'Nunito Sans',sans-serif" font-size="12" font-weight="700" fill="#242424">Crème</text>
  <text x="273" y="823" font-family="'Nunito Sans',sans-serif" font-size="10" fill="#999999">#F9F6F4</text>
</svg>
