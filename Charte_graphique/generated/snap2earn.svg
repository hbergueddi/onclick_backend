<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <filter id="shFloat" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8A959E" flood-opacity="0.40"/></filter>
    <filter id="shCard" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#101828" flood-opacity="0.40"/></filter>
    <filter id="shCta" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7.5" flood-color="#303030" flood-opacity="0.30"/></filter>
    <filter id="shNav" x="-50%" y="-100%" width="200%" height="300%"><feDropShadow dx="0" dy="-2" stdDeviation="12.5" flood-color="#000000" flood-opacity="0.05"/></filter>
  </defs>

  <!-- Écran + fond -->
  <rect width="393" height="852" rx="16" fill="#F9F6F4"/>

  <!-- Status bar -->
  <text x="28" y="38" font-family="'Nunito Sans',sans-serif" font-size="15" font-weight="700" fill="#242424">9:41</text>
  <g stroke="#242424" stroke-width="1.4" stroke-linecap="round"><path d="M333 36 v-7 M338 36 v-10 M343 36 v-13"/></g>
  <rect x="350" y="27" width="20" height="11" rx="2.5" stroke="#242424" stroke-width="1.2" opacity="0.6"/><rect x="352" y="29" width="14" height="7" rx="1.2" fill="#242424" opacity="0.9"/>

  <!-- Bouton retour flottant -->
  <g filter="url(#shFloat)"><rect x="20" y="74" width="40" height="40" rx="12" fill="#FFFFFF"/></g>
  <path d="M44 88 l-6 6 l6 6" stroke="#242424" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cloche -->
  <g filter="url(#shFloat)"><rect x="333" y="74" width="40" height="40" rx="12" fill="#FFFFFF"/></g>
  <g transform="translate(345,86)" stroke="#242424" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 11 a5 5 0 0 1 10 0 c0 2 0.6 3 1.4 3.6 a0.6 0.6 0 0 1 -0.4 1.1 H2 a0.6 0.6 0 0 1 -0.4 -1.1 C2.4 14 3 13 3 11 Z"/><path d="M6.4 16.6 a1.6 1.6 0 0 0 3.2 0"/></g>
  <circle cx="362.5" cy="84" r="3" fill="#DB4545"/>

  <!-- Titre header -->
  <text x="196.5" y="101" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="22" font-weight="600" fill="#3B2338">Scanner</text>

  <!-- Toggle segment 2 pills -->
  <rect x="20" y="130" width="353" height="48" rx="24" fill="#F5F5F5"/>
  <g filter="url(#shFloat)"><rect x="24" y="134" width="172" height="40" rx="20" fill="#681237"/></g>
  <g transform="translate(70,146)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6 v-1 a2 2 0 0 1 2 -2 h2.2 l1.2 -1.5 h5.2 l1.2 1.5 h2.2 a2 2 0 0 1 2 2 v9 a2 2 0 0 1 -2 2 h-12.4 a2 2 0 0 1 -2 -2 v-1"/><circle cx="10" cy="9" r="3.2"/></g>
  <text x="115" y="159" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="15" font-weight="600" fill="#FFFFFF">Scanner</text>
  <text x="288" y="159" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="15" font-weight="600" fill="#808080">Saisie manuelle</text>

  <!-- Grand cadre caméra -->
  <rect x="40" y="190" width="313" height="360" rx="16" fill="#2A1B25"/>

  <!-- Coins d'angle champagne (viewfinder) -->
  <g stroke="#E0AF7C" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- haut gauche -->
    <path d="M84 250 v-18 a8 8 0 0 1 8 -8 h18"/>
    <!-- haut droit -->
    <path d="M283 224 h18 a8 8 0 0 1 8 8 v18"/>
    <!-- bas gauche -->
    <path d="M110 516 h-18 a8 8 0 0 1 -8 -8 v-18"/>
    <!-- bas droit -->
    <path d="M309 490 v18 a8 8 0 0 1 -8 8 h-18"/>
  </g>

  <!-- Icône ticket / reçu au centre (champagne ligne fine) -->
  <g transform="translate(166,318)" stroke="#E0AF7C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8 4 h45 a3 3 0 0 1 3 3 v66 l-7 -4 l-7 4 l-7 -4 l-7 4 l-7 -4 l-7 4 l-6 -4 V7 a3 3 0 0 1 3 -3 Z"/>
    <path d="M18 22 h35 M18 34 h35 M18 46 h24"/>
  </g>

  <!-- Texte sous le cadre de visée -->
  <text x="196.5" y="448" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Cadrez le QR ou le ticket</text>
  <text x="196.5" y="470" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="12" fill="#9B8598">Le scan se lance automatiquement</text>

  <!-- Carte info crème -->
  <g filter="url(#shCard)"><rect x="20" y="566" width="353" height="58" rx="12" fill="#FFFFFF"/></g>
  <rect x="20" y="566" width="353" height="58" rx="12" fill="#FBF4EC"/>
  <circle cx="52" cy="595" r="16" fill="#E0AF7C" opacity="0.18"/>
  <g transform="translate(43,586)" stroke="#E0AF7C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 1 l2.3 4.7 l5.2 0.8 l-3.8 3.7 l0.9 5.2 l-4.6 -2.4 l-4.6 2.4 l0.9 -5.2 l-3.8 -3.7 l5.2 -0.8 Z"/></g>
  <text x="80" y="592" font-family="'Poltawski Nowy',Georgia,serif" font-size="14" font-weight="600" fill="#3B2338">Vous gagnez des points</text>
  <text x="80" y="610" font-family="'Nunito Sans',sans-serif" font-size="12" fill="#666666">à chaque visite dans un restaurant partenaire</text>

  <!-- CTA primaire champagne -->
  <g filter="url(#shCta)"><rect x="20" y="638" width="353" height="52" rx="12" fill="#E0AF7C"/></g>
  <g transform="translate(140,652)" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6 v-1 a2 2 0 0 1 2 -2 h2.2 l1.2 -1.5 h5.2 l1.2 1.5 h2.2 a2 2 0 0 1 2 2 v9 a2 2 0 0 1 -2 2 h-12.4 a2 2 0 0 1 -2 -2 v-1"/><circle cx="10" cy="9" r="3.2"/></g>
  <text x="196.5" y="670" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="16" font-weight="600" fill="#FFFFFF">Prendre une photo</text>

  <!-- Section Derniers scans -->
  <text x="20" y="722" font-family="'Poltawski Nowy',Georgia,serif" font-size="15" font-weight="600" fill="#3B2338">Derniers scans</text>

  <!-- Ligne 1 -->
  <text x="20" y="741" font-family="'Nunito Sans',sans-serif" font-size="13" font-weight="700" fill="#242424">La Sqala</text>
  <text x="190" y="741" font-family="'Nunito Sans',sans-serif" font-size="12" fill="#808080">240 MAD</text>
  <text x="373" y="741" text-anchor="end" font-family="'Poltawski Nowy',Georgia,serif" font-size="13" font-weight="600" fill="#E0AF7C">+24 pts</text>

  <!-- Bottom nav -->
  <g filter="url(#shNav)"><rect x="0" y="754" width="393" height="98" fill="#FFFFFF"/></g>
  <!-- Enseignes ACTIF -->
  <rect x="25" y="766" width="44" height="44" rx="12" fill="#681237"/><g transform="translate(35,776)" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M7 13 a5 5 0 0 1 -2.2 -9.2 a3.8 3.8 0 0 1 6.7 -1.1 a3.8 3.8 0 0 1 6.7 1.1 a5 5 0 0 1 -2.2 9.2"/><path d="M7 13 h10 v4 a1.2 1.2 0 0 1 -1.2 1.2 h-7.6 a1.2 1.2 0 0 1 -1.2 -1.2 z"/></g><text x="47" y="826" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" fill="#3B2338">Enseignes</text>
  <!-- Réservations -->
  <rect x="99.75" y="766" width="44" height="44" rx="12" fill="#F5F5F5"/><g transform="translate(109.75,776)" stroke="#3B2338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="4" y="6" width="16" height="15" rx="2.5"/><path d="M4 10 h16"/><path d="M9 4 v3 M15 4 v3"/><circle cx="9" cy="14.5" r="0.7" fill="#3B2338" stroke="none"/><circle cx="12" cy="14.5" r="0.7" fill="#3B2338" stroke="none"/><circle cx="15" cy="14.5" r="0.7" fill="#3B2338" stroke="none"/></g><text x="121.75" y="826" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#999999">Réservations</text>
  <!-- Majordome -->
  <rect x="174.5" y="766" width="44" height="44" rx="12" fill="#F5F5F5"/><g transform="translate(184.5,776)" stroke="#3B2338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3.5 18 h17"/><path d="M5 18 a7 7 0 0 1 14 0"/><path d="M12 7.5 v3.2"/><circle cx="12" cy="6" r="1.2" fill="#3B2338" stroke="none"/></g><text x="196.5" y="826" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#999999">Majordome</text>
  <!-- Cercle -->
  <rect x="249.25" y="766" width="44" height="44" rx="12" fill="#F5F5F5"/><g transform="translate(259.25,776)" stroke="#3B2338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="9" cy="9" r="3"/><path d="M3.5 19 a5.5 5.5 0 0 1 11 0"/><circle cx="16.5" cy="8" r="2.2"/><path d="M16 13.2 a4.6 4.6 0 0 1 4.5 4.4"/></g><text x="271.25" y="826" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#999999">Cercle</text>
  <!-- Profil -->
  <rect x="324" y="766" width="44" height="44" rx="12" fill="#F5F5F5"/><g transform="translate(334,776)" stroke="#3B2338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.2 a3.4 3.4 0 0 1 6.4 0"/><path d="M14.5 10 h3.2 M14.5 13 h3.2"/></g><text x="346" y="826" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#999999">Profil</text>
</svg>
