<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <filter id="shFloat" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8A959E" flood-opacity="0.40"/></filter>
    <filter id="shCard" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#101828" flood-opacity="0.40"/></filter>
    <filter id="shCta" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7.5" flood-color="#303030" flood-opacity="0.30"/></filter>
    <filter id="shNav" x="-50%" y="-100%" width="200%" height="300%"><feDropShadow dx="0" dy="-2" stdDeviation="12.5" flood-color="#000000" flood-opacity="0.05"/></filter>
  </defs>

  <!-- Écran + status bar -->
  <rect width="393" height="852" rx="16" fill="#F9F6F4"/>
  <text x="28" y="38" font-family="'Nunito Sans',sans-serif" font-size="15" font-weight="700" fill="#242424">9:41</text>
  <g stroke="#242424" stroke-width="1.4" stroke-linecap="round"><path d="M333 36 v-7 M338 36 v-10 M343 36 v-13"/></g>
  <rect x="350" y="27" width="20" height="11" rx="2.5" stroke="#242424" stroke-width="1.2" opacity="0.6"/><rect x="352" y="29" width="14" height="7" rx="1.2" fill="#242424" opacity="0.9"/>

  <!-- Titre planche -->
  <text x="20" y="92" font-family="'Poltawski Nowy',Georgia,serif" font-size="26" font-weight="600" fill="#3B2338">États d'écran</text>
  <text x="20" y="114" font-family="'Nunito Sans',sans-serif" font-size="13" fill="#808080">Empty · Error · Loading — specs OneClick</text>

  <!-- ========================= PANNEAU 1 : EMPTY ========================= -->
  <text x="20" y="142" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#A6A6A6">EMPTY</text>
  <g filter="url(#shCard)"><rect x="20" y="150" width="353" height="210" rx="16" fill="#FFFFFF"/></g>

  <!-- Illustration : cercle crème + icône assiette/cœur ligne aubergine -->
  <circle cx="196.5" cy="208" r="36" fill="#F7EFE7"/>
  <g transform="translate(176.5,188)" stroke="#3B2338" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="20" cy="20" r="15"/>
    <circle cx="20" cy="20" r="9.5"/>
    <path d="M20 15.5 c-1.6 -2.4 -5.4 -1.6 -5.4 1.4 c0 2.4 3 4 5.4 5.6 c2.4 -1.6 5.4 -3.2 5.4 -5.6 c0 -3 -3.8 -3.8 -5.4 -1.4 z" fill="#E0AF7C" stroke="#E0AF7C"/>
  </g>

  <text x="196.5" y="278" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="20" font-weight="600" fill="#3B2338">Aucun favori</text>
  <text x="196.5" y="300" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="13" fill="#999999">Explorez et ajoutez vos enseignes préférées</text>

  <!-- CTA champagne -->
  <g filter="url(#shCta)"><rect x="139.5" y="316" width="114" height="44" rx="12" fill="#E0AF7C"/></g>
  <g transform="translate(166,331)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="6" cy="6" r="5.2"/><path d="M9.8 9.8 l3.4 3.4"/></g>
  <text x="208" y="343" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="15" font-weight="600" fill="#FFFFFF">Explorer</text>

  <!-- ========================= PANNEAU 2 : ERROR ========================= -->
  <text x="20" y="386" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#A6A6A6">ERROR</text>
  <g filter="url(#shCard)"><rect x="20" y="394" width="353" height="210" rx="16" fill="#FFFFFF"/></g>

  <!-- Icône triangle alerte rouge dans cercle pâle -->
  <circle cx="196.5" cy="452" r="36" fill="#FBEAEA"/>
  <g transform="translate(178,434)" stroke="#DB4545" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18.5 3 L34 31 a2 2 0 0 1 -1.8 3 H4.8 a2 2 0 0 1 -1.8 -3 L16.5 3 a1.2 1.2 0 0 1 2 0 z"/>
    <path d="M17.5 14 v8"/>
    <circle cx="17.5" cy="27.5" r="0.9" fill="#DB4545" stroke="none"/>
  </g>

  <text x="196.5" y="522" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="20" font-weight="600" fill="#3B2338">Une erreur est survenue</text>
  <text x="196.5" y="544" text-anchor="middle" font-family="'Nunito Sans',sans-serif" font-size="13" fill="#999999">Vérifiez votre connexion et réessayez</text>

  <!-- Bouton outline Réessayer -->
  <rect x="136.5" y="560" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#E0AF7C" stroke-width="4"/>
  <g transform="translate(160,573)" stroke="#E0AF7C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M11 3 a7 7 0 1 0 6 4"/><path d="M17 1.5 v5 h-5"/></g>
  <text x="206" y="587" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="15" font-weight="600" fill="#E0AF7C">Réessayer</text>

  <!-- ========================= PANNEAU 3 : LOADING ========================= -->
  <text x="20" y="630" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#A6A6A6">LOADING</text>
  <g filter="url(#shCard)"><rect x="20" y="638" width="353" height="210" rx="16" fill="#FFFFFF"/></g>

  <!-- Skeleton carte resto 1 -->
  <rect x="40" y="658" width="64" height="64" rx="8" fill="#EFE7E1"/>
  <rect x="120" y="666" width="170" height="14" rx="6" fill="#F1ECEF"/>
  <rect x="120" y="690" width="120" height="11" rx="5.5" fill="#F1ECEF"/>
  <rect x="120" y="708" width="80" height="11" rx="5.5" fill="#F1ECEF"/>

  <!-- Hairline séparatrice -->
  <line x1="40" y1="742" x2="353" y2="742" stroke="#EDEDED" stroke-width="1"/>

  <!-- Skeleton carte resto 2 -->
  <rect x="40" y="758" width="64" height="64" rx="8" fill="#EFE7E1"/>
  <rect x="120" y="766" width="150" height="14" rx="6" fill="#F1ECEF"/>
  <rect x="120" y="790" width="135" height="11" rx="5.5" fill="#F1ECEF"/>
  <rect x="120" y="808" width="70" height="11" rx="5.5" fill="#F1ECEF"/>

  <!-- Libellé Chargement avec spinner -->
  <g transform="translate(265,832)" stroke="#CCCCCC" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M7 1 a6 6 0 1 0 6 6"/></g>
  <text x="282" y="838" font-family="'Nunito Sans',sans-serif" font-size="12" fill="#999999">Chargement…</text>
</svg>
