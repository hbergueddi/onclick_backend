<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <filter id="shFloat" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8A959E" flood-opacity="0.40"/></filter>
    <filter id="shCard" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#101828" flood-opacity="0.40"/></filter>
    <filter id="shCta" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7.5" flood-color="#303030" flood-opacity="0.30"/></filter>
    <filter id="shNav" x="-50%" y="-100%" width="200%" height="300%"><feDropShadow dx="0" dy="-2" stdDeviation="12.5" flood-color="#000000" flood-opacity="0.05"/></filter>
  </defs>

  <!-- Screen + status bar -->
  <rect width="393" height="852" rx="16" fill="#F9F6F4"/>
  <text x="28" y="38" font-family="'Nunito Sans',sans-serif" font-size="15" font-weight="700" fill="#242424">9:41</text>
  <g stroke="#242424" stroke-width="1.4" stroke-linecap="round"><path d="M333 36 v-7 M338 36 v-10 M343 36 v-13"/></g>
  <rect x="350" y="27" width="20" height="11" rx="2.5" stroke="#242424" stroke-width="1.2" opacity="0.6"/><rect x="352" y="29" width="14" height="7" rx="1.2" fill="#242424" opacity="0.9"/>

  <!-- Back button floating -->
  <g filter="url(#shFloat)"><rect x="20" y="74" width="40" height="40" rx="12" fill="#FFFFFF"/></g>
  <path d="M44 88 l-6 6 l6 6" stroke="#242424" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Header title -->
  <text x="196.5" y="101" text-anchor="middle" font-family="'Poltawski Nowy',Georgia,serif" font-size="22" font-weight="600" fill="#3B2338">Notifications</text>

  <!-- "Tout lire" text link -->
  <text x="373" y="100" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="14" font-weight="600" fill="#681237">Tout lire</text>

  <!-- ===================== SECTION : AUJOURD'HUI ===================== -->
  <text x="20" y="148" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#999999">AUJOURD'HUI</text>

  <!-- Card 1 : Réservation (bleu-aubergine), non-lue -->
  <g filter="url(#shCard)"><rect x="20" y="160" width="353" height="78" rx="12" fill="#FFFFFF"/></g>
  <circle cx="52" cy="199" r="20" fill="#3B2338"/>
  <g transform="translate(42,189)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="4" width="16" height="15" rx="2.5"/><path d="M2 8 h16"/><path d="M7 2 v3 M13 2 v3"/><path d="M6.5 13 l2.2 2.2 l4.5 -4.5"/></g>
  <text x="84" y="190" font-family="'Nunito Sans',sans-serif" font-size="14.5" font-weight="600" fill="#242424">Réservation confirmée</text>
  <text x="84" y="210" font-family="'Nunito Sans',sans-serif" font-size="12.5" fill="#999999">Votre table chez La Sqala est confirmée</text>
  <text x="357" y="190" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#A6A6A6">Il y a 2h</text>
  <circle cx="354" cy="208" r="3.5" fill="#DB4545"/>

  <!-- Card 2 : Points (vert), non-lue -->
  <g filter="url(#shCard)"><rect x="20" y="250" width="353" height="78" rx="12" fill="#FFFFFF"/></g>
  <circle cx="52" cy="289" r="20" fill="#00881E"/>
  <g transform="translate(42,279)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 2 l2.3 4.7 l5.2 0.8 l-3.8 3.7 l0.9 5.2 l-4.6 -2.4 l-4.6 2.4 l0.9 -5.2 l-3.8 -3.7 l5.2 -0.8 z"/></g>
  <text x="84" y="280" font-family="'Nunito Sans',sans-serif" font-size="14.5" font-weight="600" fill="#242424">+50 points crédités</text>
  <text x="84" y="300" font-family="'Nunito Sans',sans-serif" font-size="12.5" fill="#999999">Merci pour votre visite au Rick's Café</text>
  <text x="357" y="280" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#A6A6A6">Il y a 4h</text>
  <circle cx="354" cy="298" r="3.5" fill="#DB4545"/>

  <!-- Card 3 : Promo (or), lue -->
  <g filter="url(#shCard)"><rect x="20" y="340" width="353" height="78" rx="12" fill="#FFFFFF"/></g>
  <circle cx="52" cy="379" r="20" fill="#E0AF7C"/>
  <g transform="translate(42,369)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 8 a2 2 0 0 1 2 -2 h7 l6 6 -7 7 -6 -6 v-3 z"/><circle cx="8" cy="11" r="1.3"/></g>
  <text x="84" y="370" font-family="'Nunito Sans',sans-serif" font-size="14.5" font-weight="600" fill="#242424">Nouvelle offre : -20%</text>
  <text x="84" y="390" font-family="'Nunito Sans',sans-serif" font-size="12.5" fill="#999999">Profitez-en au Rick's Café ce week-end</text>
  <text x="357" y="370" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#A6A6A6">Il y a 6h</text>

  <!-- ===================== SECTION : CETTE SEMAINE ===================== -->
  <text x="20" y="456" font-family="'Nunito Sans',sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#999999">CETTE SEMAINE</text>

  <!-- Card 4 : Parrainage (bordeaux), lue -->
  <g filter="url(#shCard)"><rect x="20" y="468" width="353" height="78" rx="12" fill="#FFFFFF"/></g>
  <circle cx="52" cy="507" r="20" fill="#681237"/>
  <g transform="translate(42,497)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="8" cy="7" r="3"/><path d="M2.5 18 a5.5 5.5 0 0 1 11 0"/><path d="M15 6 v6 M12 9 h6"/></g>
  <text x="84" y="498" font-family="'Nunito Sans',sans-serif" font-size="14.5" font-weight="600" fill="#242424">Invitation acceptée</text>
  <text x="84" y="518" font-family="'Nunito Sans',sans-serif" font-size="12.5" fill="#999999">Sofia a accepté votre invitation</text>
  <text x="357" y="498" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#A6A6A6">Lun.</text>

  <!-- Card 5 : Réservation (bleu-aubergine), lue -->
  <g filter="url(#shCard)"><rect x="20" y="558" width="353" height="78" rx="12" fill="#FFFFFF"/></g>
  <circle cx="52" cy="597" r="20" fill="#3B2338"/>
  <g transform="translate(42,587)" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="4" width="16" height="15" rx="2.5"/><path d="M2 8 h16"/><path d="M7 2 v3 M13 2 v3"/><path d="M10 11 v3 l2.2 1.3"/></g>
  <text x="84" y="588" font-family="'Nunito Sans',sans-serif" font-size="14.5" font-weight="600" fill="#242424">Rappel de réservation</text>
  <text x="84" y="608" font-family="'Nunito Sans',sans-serif" font-size="12.5" fill="#999999">Demain 20h00 au Dar Naji Rabat</text>
  <text x="357" y="588" text-anchor="end" font-family="'Nunito Sans',sans-serif" font-size="11" fill="#A6A6A6">Dim.</text>
</svg>
