# ════════════════════════════════════════════════════════════════════
# oneclick-loyalty-service — Phase 2 §21 spec senior dev
# ════════════════════════════════════════════════════════════════════
# Port    : 8085
# DB      : oneclick_enterprise (partagée — tables loyalty_*, redemptions, tiers)
# Swagger : http://localhost:8085/swagger-ui.html
# ════════════════════════════════════════════════════════════════════

spring:
  application:
    name: oneclick-loyalty-service

  datasource:
    url: jdbc:postgresql://localhost:5432/oneclick_enterprise
    username: oneclick_app
    password: OneclickLocal2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # ─── Kafka producer (publish events) ─────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        acks: all

  # ─── Spring Modulith — event externalisation ─────────────────────────
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false  # Table event_publication créée par core/Flyway V8
      externalization:
        enabled: true

server:
  port: 8085

logging:
  level:
    com.onesley.oneclick.loyalty: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
