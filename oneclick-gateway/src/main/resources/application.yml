# ════════════════════════════════════════════════════════════════════
# oneclick-gateway — Phase 2.7 §21 spec senior dev
# ════════════════════════════════════════════════════════════════════
# Port : 8080 (point d'entrée unique pour les clients)
#
# Routing par path prefix (cf GatewayConfig.java) :
#   /api/notifications/**  → :8084 (oneclick-notification-service)
#   /api/loyalty/**        → :8085 (oneclick-loyalty-service)
#   /api/payments/**       → :8086 (oneclick-payment-service)
#   /api/search/**         → :8087 (oneclick-search-service)
#   /api/**  (catchall)    → :8083 (oneclick-core, monolithe résiduel)
#
# IMPORTANT : Spring Cloud Gateway 2025.0 ne supporte pas Spring Boot 4.
# Cette implémentation utilise un routeur WebFlux manuel via RouterFunction
# (cf GatewayConfig.java). Performance Netty équivalente, sans le starter SCG.
# ════════════════════════════════════════════════════════════════════

spring:
  application:
    name: oneclick-gateway

server:
  port: 8080

logging:
  level:
    com.onesley.oneclick.gateway: INFO
    reactor.netty.http.client: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
